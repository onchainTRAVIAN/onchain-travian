name: Bug report
description: Something in the game doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [PC, Phone, Tablet]
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 140, Safari iOS 19
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: Drag images here if they help.
